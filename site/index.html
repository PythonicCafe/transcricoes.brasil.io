<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Transcripts - Brasil.IO</title>
  <!-- Applies the color theme before the CSS loads, so the page does not flash. The only script outside js/. -->
  <script>
    (function () {
      var theme = "system";
      try { theme = localStorage.getItem("color-theme") || "system"; } catch (error) { /* no storage */ }
      var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- Requests already in the HTML, so the browser does not wait for app.js to find the modules and the session list. -->
  <link rel="modulepreload" href="js/modules/texts.js">
  <link rel="modulepreload" href="js/modules/search.js">
  <link rel="modulepreload" href="js/modules/format.js">
  <link rel="preload" href="data/items.json" as="fetch" crossorigin>
</head>
<body>
<a class="visually-hidden-focusable" href="#app" data-t="skip">Skip to content</a>
<header class="site-nav">
  <nav class="container site-nav__inner" data-t-label="menu_label" aria-label="Main">
    <a href="#/"><img class="site-nav__logo" src="logo-brasil-io.png" alt="Brasil.IO"></a>
    <span class="site-nav__name" data-t="brand">Transcripts</span>
    <a class="site-nav__link" id="about-link" href="#/sobre" data-t="menu_about">How it was made</a>
    <a class="site-nav__link" id="repository-link" href="https://github.com/PythonicCafe/transcricoes.brasil.io" data-t="menu_code">Source code</a>
    <div class="option-group" role="group" data-t-label="language_label" aria-label="Language">
      <button class="option-group__option" type="button" data-language="en" lang="en" title="English">en</button>
      <button class="option-group__option" type="button" data-language="pt" lang="pt-BR" title="Português">pt</button>
      <button class="option-group__option" type="button" data-language="es" lang="es" title="Español">es</button>
    </div>
    <div class="option-group option-group--pill" role="group" data-t-label="color_theme_label" aria-label="Color theme">
      <button class="option-group__option" type="button" data-color-theme="light" data-t="theme_light">Light</button>
      <button class="option-group__option" type="button" data-color-theme="dark" data-t="theme_dark">Dark</button>
      <button class="option-group__option" type="button" data-color-theme="system" data-t="theme_system">System</button>
    </div>
  </nav>
</header>
<main class="container" id="app" tabindex="-1">
  <p>Loading…</p>
  <noscript><p>This site needs JavaScript: search runs in your browser. Este site precisa de JavaScript: a busca roda no navegador.</p></noscript>
</main>
<footer class="container site-footer">
  <p><span data-t="footer"></span> <a href="https://brasil.io/">Brasil.IO</a> · <a href="https://pythonic.cafe/">Pythonic Café</a></p>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
