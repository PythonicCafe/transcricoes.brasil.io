# Ambiente de desenvolvimento. O repositório inteiro é montado em /app, com a pasta data/ dentro dele.
services:
  main:
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
    image: transcricoes-brasil-io:latest
    working_dir: /app
    volumes:
      - ./:/app
    # Só repassa as chaves que existirem no ambiente de quem chama; nenhuma fica gravada em arquivo.
    environment:
      - YOUTUBE_API_KEY
      - GROQ_API_KEY
      - MARITACA_API_KEY

  # O mesmo contêiner sem rede, para o que só lê e escreve arquivos locais.
  offline:
    extends:
      service: main
    network_mode: none
